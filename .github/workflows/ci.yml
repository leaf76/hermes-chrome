# Fast checks on every push/PR. No live Chrome or local bridge required.
#
# Local: ./scripts/ci-check.sh
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python compile and unit tests
        shell: bash
        run: |
          python -m compileall -q bridge.py mcp_server.py native_host lib tests scripts/doctor.py scripts/install-mcp.py
          python -m unittest discover -s tests -v

      - name: JS syntax checks
        shell: bash
        run: |
          for f in extension/*.js npm/bin/*.js; do
            node --check "$f"
          done

      - name: Shell checks and CWS zip packaging (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/ci-check.sh store/package.sh
          ./scripts/ci-check.sh

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript

      - name: Analyze
        uses: github/codeql-action/analyze@v3
